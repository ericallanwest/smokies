# Watch the deployed solve service.
#
# The pace controls on the public site depend on a Cloud Run service that
# scales to zero and is deployed separately from this repo, so nothing here
# fails when it breaks -- the first sign would be a hiker reporting that
# "build itinerary" spun forever.  This closes that gap: a failing run emails
# whoever owns the repo.
#
# It checks the three things that can independently break:
#   1. the service answers at all (deployed, not crash-looping)
#   2. a default-pace solve still matches the published preset -- the check
#      that caught CP-SAT timing out on a slower vCPU and silently returning
#      a different circuit
#   3. a custom-pace solve works, which needs segment_profiles.json inside the
#      image; it was missing from the first build and nothing but a real
#      request would have noticed
name: solver health

on:
  schedule:
    - cron: '17 */6 * * *'      # every six hours, off the hour to dodge the rush
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Service is up
        run: |
          set -euo pipefail
          # First request of the day pays a cold start, so allow for it.
          health=$(curl -sS --max-time 120 --retry 2 --retry-delay 10 \
                   "$SOLVER_URL/health")
          echo "health: $health"
          echo "$health" | python -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h.get('ok') is True, h
          assert 'queued' in h, 'old build: rate limiting is not deployed'
          "
        env:
          SOLVER_URL: https://smokies-solver-165021828782.us-east1.run.app

      - name: Default pace still agrees with the published preset
        run: |
          set -euo pipefail
          curl -sS --max-time 240 -X POST "$SOLVER_URL/solve" \
            -H 'Content-Type: application/json' \
            -d '{"max_hours":12,"time_budget":90,"start_node":"TH001"}' > result.ndjson
          python - <<'PY'
          import json
          result = None
          for line in open('result.ndjson'):
              line = line.strip()
              if not line:
                  continue
              obj = json.loads(line)
              if obj['type'] == 'error':
                  raise SystemExit(f"solver returned an error: {obj['message']}")
              if obj['type'] == 'result':
                  result = obj
          assert result, 'stream ended without a result'

          # Pinned to the preset's own start.  Published presets are solved
          # from a swept start rather than the default one, so an unpinned
          # request would return the default's day count and disagree with the
          # file for a reason that is not a fault.
          pub = json.load(open('docs/data/preset_selfsup_12h.json'))
          assert pub['start_node'] == 'TH001', (
              f"preset now starts at {pub['start_node']}; update the pin above")
          published = pub['n_days']
          got = result['open']['n_days']
          cpsat = result['params']['cpsat']
          print(f"open {got} days (preset says {published}), cpsat {cpsat}")

          # The service and the site must not disagree at identical settings.
          assert got == published, (
              f"service returns {got} days where the published preset has "
              f"{published}; cpsat={cpsat}")

          # Route, not just cost.  This used to compare tour cost only, because
          # presets were generated on Windows while the service runs a
          # manylinux wheel: CP-SAT is seeded and single-threaded, so it is
          # reproducible against one binary and not across two, and the two
          # picked different members of the same optimal set.  Presets are now
          # generated on Linux against the pinned wheel in
          # backend/requirements.txt (see tools/LOCAL_DEV.md), which makes the
          # published route reproducible by the service arc for arc -- so
          # assert that, and catch a wheel bump that silently reroutes
          # everything at equal cost.
          def arcs_of(o):
              return [(a['from'], a['to'], a['edge_id'], a['is_deadhead'])
                      for d in o['days'] for a in d['arcs']]
          want_s = sum(a['seconds'] for d in pub['days'] for a in d['arcs'])
          have_s = sum(a['seconds'] for d in result['open']['days']
                       for a in d['arcs'])
          print(f"walk {have_s:,}s (preset {want_s:,}s), "
                f"required {result['open']['total_required_miles']:.1f} mi")
          assert have_s == want_s, (
              f"walk costs {have_s}s where the preset costs {want_s}s -- "
              f"that is a cost regression")
          assert abs(result['open']['total_required_miles']
                     - pub['total_required_miles']) < 0.05, 'coverage drifted'
          assert arcs_of(result['open']) == arcs_of(pub), (
              "service and preset take different routes at equal cost -- the "
              "solver wheel or seed changed; regenerate the presets on Linux")
          assert result['params']['hiking_style'] == 'self-supported'
          assert cpsat['status'] == 'OPTIMAL', (
              f"direction assignment was cut short: {cpsat}")
          assert result['best_found'] is False, 'solve was truncated'
          PY
        env:
          SOLVER_URL: https://smokies-solver-165021828782.us-east1.run.app

      - name: Custom pace works
        run: |
          set -euo pipefail
          curl -sS --max-time 240 -X POST "$SOLVER_URL/solve" \
            -H 'Content-Type: application/json' \
            -d '{"max_hours":12,"time_budget":90,"tobler_k":4.2}' > pace.ndjson
          python - <<'PY'
          import json
          result = None
          for line in open('pace.ndjson'):
              line = line.strip()
              if not line:
                  continue
              obj = json.loads(line)
              if obj['type'] == 'error':
                  # The likely cause is segment_profiles.json missing from the
                  # image, which the solver refuses rather than papering over.
                  raise SystemExit(f"custom pace refused: {obj['message']}")
              if obj['type'] == 'result':
                  result = obj
          assert result, 'stream ended without a result'
          assert result['params']['tobler']['custom'] is True, result['params']
          days = result['open']['n_days']
          print(f"custom pace k=4.2: open {days} days")
          # A harder pace cannot need fewer days than the default pace does.
          # 41 is the *unpinned* 12 h count -- this request names no start, so
          # it is not the 40 of preset_selfsup_12h.json, which is solved from a
          # swept start.  It moved from 42 when town nights became
          # unconditional, which is worth a day on its own.
          assert days > 41, f"k=4.2 gave {days} days, which is not slower"
          PY
        env:
          SOLVER_URL: https://smokies-solver-165021828782.us-east1.run.app

      - name: Supported style is reachable and road-anchored
        run: |
          set -euo pipefail
          curl -sS --max-time 300 -X POST "$SOLVER_URL/solve"             -H 'Content-Type: application/json'             -d '{"max_hours":16,"style":"supported","time_budget":90}' > sup.ndjson
          python - <<'PY'
          import json
          result = None
          for line in open('sup.ndjson'):
              line = line.strip()
              if not line:
                  continue
              obj = json.loads(line)
              if obj['type'] == 'error':
                  raise SystemExit(f"supported solve refused: {obj['message']}")
              if obj['type'] == 'result':
                  result = obj
          assert result, 'stream ended without a result'
          assert result['params']['hiking_style'] == 'supported', result['params']
          o = result['open']
          # The whole point of the style: a crew can only meet the hiker where
          # they can be reached, so every day has to start and finish at a
          # trailhead, a frontcountry campground, or the Hazel Creek boat
          # landing (TI051) that the Fontana Lake shuttle serves.
          REACHABLE = ('TH', 'CG')
          SHUTTLE = {'TI051', 'TI053', 'TI064', 'BC090'}
          def ok(n):
              return n[:2] in REACHABLE or n in SHUTTLE
          bad = [(d['day'], d['start_node'], d['end_node']) for d in o['days']
                 if not ok(d['start_node']) or not ok(d['end_node'])]
          assert not bad, f"days the crew cannot reach: {bad[:3]}"
          # And at least one day must actually be repositioned, or the crew is
          # buying the hiker nothing and the day split silently fell back to a
          # plain contiguous walk.
          moved = sum(1 for k in range(len(o['days']) - 1)
                      if o['days'][k]['end_node'] != o['days'][k + 1]['start_node'])
          ferry = sum(1 for d in o['days']
                      if d['start_node'] in SHUTTLE or d['end_node'] in SHUTTLE)
          print(f"supported 16h: {o['n_days']} days, {moved} crew shuttles, "
                f"{ferry} ferry days")
          assert moved > 0, 'no day is repositioned; free repositioning did not fire'
          # This request offers no landings, and 16 h does not need any.  A
          # ferry day here would mean the solver reached for one it was never
          # given, which is the failure worth catching: a published preset that
          # quietly depends on a boat nobody booked.
          assert ferry == 0, 'used a ferry landing without being offered one'
          assert result['params']['shuttle_nodes_offered'] == [], result['params']
          PY
        env:
          SOLVER_URL: https://smokies-solver-165021828782.us-east1.run.app
